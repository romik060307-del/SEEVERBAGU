plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rk.server'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rk.server'
        minSdk 19
        targetSdk 28
        versionCode 7
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
